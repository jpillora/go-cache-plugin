name: Go presubmit

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Go presubmit
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ['ubuntu-latest']
    steps:
    - uses: actions/checkout@v7
    - name: Install Go from go.mod
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod
    - uses: creachadair/go-presubmit-action@v2
      with:
        check-staticcheck: 'no'
    - name: Run module-pinned Staticcheck
      run: go tool staticcheck ./...
